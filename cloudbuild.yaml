# Google Cloud Build configuration
steps:
  # Build WebSocket Server
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/websocket-server:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/websocket-server:latest'
      - '-f'
      - 'websocket-server/Dockerfile.cloudrun'
      - 'websocket-server'
    id: 'build-websocket-server'

  # Push WebSocket Server image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/websocket-server:$COMMIT_SHA']
    id: 'push-websocket-server'
    waitFor: ['build-websocket-server']

  # Deploy WebSocket Server to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'websocket-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/websocket-server:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '100'
      - '--concurrency'
      - '1000'
      - '--cpu-throttling'
      - '--session-affinity'
      - '--set-env-vars'
      - |
        NODE_ENV=production,
        OPENAI_API_KEY=${_OPENAI_API_KEY},
        TWILIO_ACCOUNT_SID=${_TWILIO_ACCOUNT_SID},
        TWILIO_AUTH_TOKEN=${_TWILIO_AUTH_TOKEN},
        TWILIO_PHONE_NUMBER=${_TWILIO_PHONE_NUMBER},
        ALLOWED_ORIGIN=${_ALLOWED_ORIGIN}
    id: 'deploy-websocket-server'
    waitFor: ['push-websocket-server']

  # Build Frontend (optional - can deploy to Vercel separately)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/webapp:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_WEBSOCKET_URL=${_WEBSOCKET_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}'
      - 'webapp'
    id: 'build-webapp'

  # Push Frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA']
    id: 'push-webapp'
    waitFor: ['build-webapp']

  # Deploy Frontend to Cloud Run (optional)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'webapp'
      - '--image'
      - 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--cpu'
      - '1'
      - '--memory'
      - '1Gi'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '50'
    id: 'deploy-webapp'
    waitFor: ['push-webapp']

substitutions:
  _REGION: us-central1
  _WEBSOCKET_URL: wss://websocket-server-xxxxx-uc.a.run.app
  _ALLOWED_ORIGIN: https://webapp-xxxxx-uc.a.run.app

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

images:
  - 'gcr.io/$PROJECT_ID/websocket-server:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/websocket-server:latest'
  - 'gcr.io/$PROJECT_ID/webapp:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/webapp:latest'