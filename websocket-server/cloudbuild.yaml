steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ai-voice-caller-websocket', '-f', 'Dockerfile.cloudrun', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-voice-caller-websocket']

images:
  - 'gcr.io/$PROJECT_ID/ai-voice-caller-websocket'

options:
  logging: CLOUD_LOGGING_ONLY